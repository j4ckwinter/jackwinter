name: link check

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200..=299,999
            --remap 'https://www.npmjs.com/package/(.+) https://registry.npmjs.org/$1'
            --exclude-path dist/_astro
            --base-url https://www.jackwinter.xyz
            dist/index.html dist/index.md dist/llms.txt
          fail: true
