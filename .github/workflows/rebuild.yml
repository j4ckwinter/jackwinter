name: daily rebuild

on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Vercel to rebuild the site
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::error::Set the VERCEL_DEPLOY_HOOK repository secret to a Vercel deploy hook for main."
            exit 1
          fi
          curl --fail --silent --show-error -X POST "$DEPLOY_HOOK"
